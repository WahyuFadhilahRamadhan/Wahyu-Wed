<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bgBride" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dceaf2"/>
      <stop offset="100%" stop-color="#6b93ad"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgBride)"/>

  <!-- shoulders / abaya -->
  <path d="M96 400 C96 300 140 268 200 268 C260 268 304 300 304 400 Z" fill="#3f5a70"/>

  <!-- hijab + niqab: fully covers head, neck and face, no facial features -->
  <path d="M118 400 C112 300 128 210 200 200 C272 210 288 300 282 400 Z" fill="#4a6b83"/>
  <path d="M132 250 C126 175 150 105 200 100 C250 105 274 175 268 250
           C268 190 240 140 200 138 C160 140 132 190 132 250 Z" fill="#4a6b83"/>

  <!-- niqab face covering (no eyes/features, fully covered) -->
  <path d="M156 210 C156 160 174 128 200 128 C226 128 244 160 244 210
           C244 240 226 258 200 258 C174 258 156 240 156 210 Z" fill="#354d5f"/>
  <line x1="200" y1="150" x2="200" y2="250" stroke="#2b3d4a" stroke-width="2" opacity="0.6"/>

  <!-- small floral pin accent -->
  <g transform="translate(200,112)">
    <circle r="5" fill="#dceaf2"/>
    <circle cx="9" cy="0" r="4" fill="#dceaf2" opacity="0.85"/>
    <circle cx="-9" cy="0" r="4" fill="#dceaf2" opacity="0.85"/>
    <circle cx="0" cy="9" r="4" fill="#dceaf2" opacity="0.85"/>
    <circle cx="0" cy="-9" r="4" fill="#dceaf2" opacity="0.85"/>
    <circle r="3" fill="#e8c9a0"/>
  </g>
</svg>
